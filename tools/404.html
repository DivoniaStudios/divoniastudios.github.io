<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GAME OVER · Divonia Studios</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/brand/favicon.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("divonia-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          if (t === "light") document.documentElement.className = "light";
        } catch (e) {}
      })();
    </script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 50% 45% at 50% 42%, rgb(236 31 39 / 0.18), transparent 70%),
          #0b0a10;
        color: #f1ecf4;
        font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(to bottom, rgb(255 255 255 / 0.03) 0 1px, transparent 1px 3px);
      }
      img { width: 96px; height: auto; image-rendering: pixelated; }
      h1 {
        margin: 28px 0 0;
        font: 700 clamp(3rem, 12vw, 7rem)/1 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.04em;
        color: #ff4b53;
      }
      p { margin: 18px auto 0; max-width: 32rem; color: #a9a2b8; }
      nav { margin-top: 36px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-block;
        padding: 14px 22px;
        font: 600 15px/1 ui-monospace, "SF Mono", Menlo, monospace;
        color: #fff;
        background: #d8141d;
        text-decoration: none;
        box-shadow: 4px 4px 0 #7a0b12;
        transition: transform 120ms, box-shadow 120ms;
      }
      a.alt { background: #1a1724; box-shadow: 4px 4px 0 #000, inset 0 0 0 1px rgb(241 236 244 / 0.18); }
      a:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #7a0b12; }
      a:focus-visible { outline: 2px solid #ff4b53; outline-offset: 4px; }
      .blink { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
      /* Gündüz: sitenin kayıtlı tercihi varsa o, yoksa sistem ayarı (betik aşağıda) */
      html.light { color-scheme: light; }
      html.light body {
        background: radial-gradient(ellipse 50% 45% at 50% 42%, rgb(236 31 39 / 0.1), transparent 70%), #f5f2f7;
        color: #17141f;
      }
      html.light h1 { color: #c4121a; }
      html.light p { color: #595366; }
      html.light a.alt { background: #fcfbfd; color: #17141f; box-shadow: 4px 4px 0 #17141f, inset 0 0 0 1px rgb(23 20 31 / 0.2); }
      html.light body::after { background: none; }
      html.light .mark-dark { display: none; }
      html:not(.light) .mark-light { display: none; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark-dark" src="/brand/mark.png" alt="Divonia Studios" width="96" height="96" />
      <img class="mark-light" src="/brand/mark-on-light.png" alt="Divonia Studios" width="96" height="96" />
      <h1>GAME OVER</h1>
      <p>Aradığın sayfa bu seviyede yok.<br />The page you are looking for isn't on this level.</p>
      <nav>
        <a href="/tr/">Ana menü<span class="blink">_</span></a>
        <a class="alt" href="/en/" lang="en">Main menu</a>
      </nav>
    </main>
  </body>
</html>
