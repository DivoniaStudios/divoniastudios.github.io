<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Divonia Studios</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://divoniastudios.com/tr/" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/brand/icon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/brand/icon-96.png" sizes="96x96" type="image/png" />
    <link rel="icon" href="/brand/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      // Tarayıcı dili Türkçe ise /tr/, değilse /en/.
      // Eski tek sayfalık sitenin #featured / #services bağlantıları da
      // yeni sayfalara taşınıyor.
      (function () {
        var lang = (navigator.language || "en").toLowerCase();
        var tr = lang.indexOf("tr") === 0;
        var hash = window.location.hash;
        var target = tr ? "/tr/" : "/en/";
        if (hash === "#featured") target += tr ? "oyunlar/date-for-dead/" : "games/date-for-dead/";
        else if (hash === "#services") target += tr ? "hizmetler/" : "services/";
        window.location.replace(target);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/en/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0a10;
        color: #a9a2b8;
        font: 15px/1.6 system-ui, sans-serif;
      }
      a { color: #ff4b53; }
    </style>
  </head>
  <body>
    <p>Yükleniyor… <a href="/tr/">Divonia Studios</a></p>
  </body>
</html>
